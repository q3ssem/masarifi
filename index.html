<style>
:root{color-scheme:light;--body:"IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;--display:"Reem Kufi", "IBM Plex Sans Arabic", system-ui, Tahoma, sans-serif;--bg:#FFFFFF;--surface:#FFFFFF;--soft:#F4F7F5;--line:#E8EDEA;--accent:#0E7C5F;--on-accent:#FFFFFF;--bad:#D1432F;--scrim:rgba(20, 32, 28, 0.4);--t-peach:#FFD3B5;--t-mint:#B8F0D0;--t-lilac:#D8CCFF;--t-butter:#FFE48A;--t-sky:#B5DCFF;--k-food:#E07B1F;--k-coffee:#8B5A3A;--k-groceries:#3E9B3E;--k-transport:#2F7BD1;--k-bills:#7458D6;--k-shopping:#D6407F;--k-fun:#15A0AE;--k-health:#D94646;--k-other:#6F7F7A}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:400 15px/1.6 var(--body);padding-block:18px 128px}
#app{margin-inline:auto}
button, input{font:inherit;color:inherit}

.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.cur{font-size:0.5em;font-weight:500;margin-inline-start:0.35em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb, var(--c) 16%, var(--bg))}

.tabs{display:grid}
.hero-label{margin:0;font-size:14px}

.demo{margin:0 0 12px;padding:10px 14px;border-radius:12px;font-size:13.5px}
.tools{display:flex;flex-wrap:wrap;align-items:center;margin-top:14px;color:var(--muted);font-size:13.5px}

.cat{padding:10px 0 12px;border-bottom:1px solid var(--line)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row-main{min-width:0;overflow-wrap:anywhere}

@media (prefers-color-scheme: dark){

}

.primary{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px}

.row-amt.in{color:var(--accent)}

.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-height:92dvh;overflow-y:auto;background:var(--surface);padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sub{margin:0 0 4px;color:var(--muted);font-size:14px}
.field{display:block;margin-top:14px}
.field > span, legend{display:block;margin-bottom:6px;color:var(--muted);font-size:13.5px;padding:0}
.field input{width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent)}

fieldset{border:0;margin:14px 0 0;padding:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input, .ico-opt input, .sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 14px;border:1.5px solid var(--line);border-radius:999px}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.icons{display:grid;gap:6px}
.ico-opt{position:relative}
.ico-opt span{place-items:center;border:1.5px solid var(--line);border-radius:12px}
.ico-opt input:checked + span{background:color-mix(in srgb, var(--accent) 14%, var(--surface))}
.ico-opt input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative;width:38px;height:38px}
.sw span{display:block;width:100%;height:100%;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.sw input:checked + span{box-shadow:0 0 0 3px var(--fg)}
.sw input:focus-visible + span{outline:3px solid var(--accent);outline-offset:3px}
.mrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.mrow small{color:var(--muted)}
.mrow .confirm{padding:0}
.err{min-height:22px;margin:10px 0 0;color:var(--bad);font-size:13.5px}
.sheet .primary{margin-top:6px}
.sheet .btn-sm{display:block;width:100%;margin-top:10px}
.sheet .mrow .btn-sm{display:inline-block;width:auto;margin-top:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom, 0px));z-index:30;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px}
@media (prefers-reduced-motion: no-preference){
.sheet{animation:rise 0.22s ease-out}
.pbar span{transition:width 0.4s ease}
}
@keyframes rise{from { transform: translateY(24px); opacity: 0.4; } to { transform: none; opacity: 1; }}
.brand{display:flex;align-items:center}
.finder{display:grid;grid-template-columns:1fr minmax(0, 140px);gap:8px;margin-top:14px}
.finder input, .finder select{width:100%;min-width:0;min-height:44px;padding:6px 12px;border:1.5px solid var(--line)}
.finder input:focus, .finder select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent)}
.trend{display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:6px;align-items:end;height:160px;margin-top:8px}
.insight{margin-top:12px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.note{margin:8px 0 0;color:var(--muted);font-size:13px}
.file{position:relative;text-align:center;line-height:28px;cursor:pointer}
.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 8px 16px -8px var(--accent);flex:none}
.logo .ic{width:22px;height:22px;stroke-width:2.1}
.top h1{font-size:26px;color:var(--fg)}
.brand .icon-btn{background:var(--soft);border-radius:14px}
.months strong{font-size:14px}
.tabs{gap:8px;padding:0;background:transparent;border-radius:0;margin-bottom:18px}
.tab{display:flex;flex-direction:column;align-items:center;font-weight:500}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{font-weight:600}
.hero{overflow:hidden;padding:20px 20px 14px}
.hero::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;left:-60px;top:-70px}
.hero > *{position:relative;z-index:1}

.hero-total{font-size:42px;margin:0 0 6px}
.hring{position:relative;width:86px;height:86px;flex:none;display:grid;place-items:center;font-weight:700;font-size:17px}

.hring .rt{fill:none;stroke-width:10}

.hring.over .rf{stroke:var(--bad)}
.stats{display:grid;margin:10px 0 0;padding:0;border:0}
.stat:first-child{align-items:center;justify-content:space-between;gap:12px}
.stat dd{margin:2px 0 0;color:var(--fg)}
.stat:first-child dd{margin:0}
.stat dd.bad{color:var(--bad)}
.tone-sky{background:var(--t-sky)}
.tone-butter{background:var(--t-butter)}
.tools{justify-content:flex-start;gap:10px}
.chip-btn{background:var(--soft);border:0}
.demo{background:var(--t-butter);border:0;color:var(--fg)}
.section{margin-top:26px}
h2{font-size:18px}
.section-head span{background:var(--soft);border-radius:999px;padding:0 10px}
.bento{display:grid;gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .t-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tile .badge{background:#fff;width:42px;height:42px;border-radius:16px}
.t-pct{font-size:13px;font-weight:600;color:color-mix(in srgb, var(--c) 75%, #000)}
.t-name{font-size:14px;overflow-wrap:anywhere}
.t-amt{font-size:18px;font-weight:700}
.t-bar{display:block;margin-top:4px;border-radius:999px;overflow:hidden}
.t-bar i{display:block;height:100%;border-radius:999px}
.day{margin-top:12px;padding:12px 16px 4px;background:#fff;border:1px solid var(--line)}
.day-head{border-bottom:0;padding-bottom:2px}
.rows .row:last-child{border-bottom:0}
.section > .rows{padding:4px 16px;background:#fff;border:1px solid var(--line)}
.card .pbar{background:#fff;height:7px}
.card .btn-sm{background:#fff;border-color:transparent}
.card .btn-sm.danger{background:var(--bad);color:#fff}
.ringb{position:relative;width:54px;height:54px;flex:none;display:grid;place-items:center;color:var(--c)}
.ringb .rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringb .rt{fill:none;stroke:#fff;stroke-width:5}
.ringb .rf{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round}
.trend{background:var(--soft);border-radius:28px;padding:16px 10px 8px;box-sizing:content-box}
.insight{background:var(--t-lilac);border:0;border-radius:24px}
.finder input, .finder select{background:var(--soft);border-color:transparent;border-radius:999px;padding-inline:16px}
.bar{background:none;pointer-events:none}
.bar-in{pointer-events:auto;padding:7px;border-radius:999px;box-shadow:0 12px 32px -10px rgba(20, 32, 28, 0.45), 0 0 0 1px var(--line)}
.bar .primary{border-radius:999px;min-height:50px;font-size:15.5px}
.primary.alt{background:var(--t-mint);border:0;color:var(--accent)}
.sheet{border-radius:32px 32px 0 0}
.field input{background:var(--soft);border-color:transparent}
.chip span{background:var(--soft);border-color:transparent}
.ico-opt span{background:var(--soft);border-color:transparent}
.ico-opt input:checked + span{border-color:var(--accent)}
.card .btn-sm.pay{background:var(--accent);color:#fff}
.meta b.bad{color:var(--bad);font-weight:600}
.icons{grid-template-columns:repeat(auto-fill, minmax(76px, 1fr))}
.ico-opt span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:auto;min-height:68px;padding:8px 4px;text-align:center}
.ico-opt span small{font-size:11.5px;line-height:1.3;color:var(--muted)}
.endrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(0,0,0,.12)}
.endrow small{display:block;font-size:12px}
.endrow b{font-size:16px}
.sched{margin-top:12px;padding:6px 10px;max-height:360px;overflow:auto}
.srow{display:grid;grid-template-columns:1.5fr repeat(var(--n,2),1fr);gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:13px}

.shead{font-size:11px;opacity:.65;position:sticky;top:0;background:#fff}
.hero{color:#fff}
.hero.h-inst{background:linear-gradient(135deg, #7C5CFF 0%, #38BDF8 100%)}

.hero::after{background:rgba(255,255,255,.2)}
.hero-label, .hero .meter-row, .hero .meter-row b, .endrow small{color:rgba(255,255,255,.92);opacity:1}
.hero-total, .hero-total *, .endrow b{color:#fff}
.hero .hring .rt{stroke:rgba(255,255,255,.3)}
.hero .hring .rf{stroke:#fff}
.hero .hring{color:#fff}
.endrow{border-top-color:rgba(255,255,255,.4)}
.endrow .btn-sm{background:#fff;color:var(--fg);border:0;font-weight:600}
.sched{color:var(--fg)}
.hero .foot{color:rgba(255,255,255,.9)}
.hero .demo{background:rgba(255,255,255,.9)}
.tab{color:var(--fg)}
.stats{gap:10px}
.stats.n3{grid-template-columns:repeat(3, minmax(0, 1fr))}
.stats .stat, .stats .stat:first-child{grid-column:auto;display:block;padding:12px 12px;text-align:start;min-height:74px}
.stat dt{font-size:12px;color:rgba(20,32,28,.7)}
.stat dd, .stat:first-child dd{font-weight:800;margin-top:4px}
.stats.n3 .stat dd{font-size:14.5px}
.stat.tone-peach{background:var(--t-peach)}
.stat.tone-sky{background:var(--t-sky)}
.stat.tone-lilac{background:var(--t-lilac)}

.sched{background:#fff}
.finder{margin-bottom:16px}

.yn .primary{flex:1 1 0;margin:0;border-radius:18px;min-height:52px}
.sheet .rp{margin-top:4px}
.sheet > .primary[data-rp]{margin-top:16px}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
button, .tile, .card, .row{touch-action:manipulation}
@media (prefers-reduced-motion: no-preference){
button{transition:transform .16s cubic-bezier(.3,.7,.4,1.4), background-color .2s, box-shadow .2s, opacity .2s}
button:active:not(:disabled){transform:scale(.95)}
.tab{transition:transform .2s cubic-bezier(.3,.7,.4,1.4), background .3s, color .2s}
#view.enter > *{animation:rise-in .42s cubic-bezier(.22,.9,.3,1) both}
#view.enter > *:nth-child(2){animation-delay:.05s}
#view.enter > *:nth-child(3){animation-delay:.1s}
#view.enter > *:nth-child(4){animation-delay:.15s}
#view.enter > *:nth-child(n+5){animation-delay:.2s}
.sched{animation:unfold .35s cubic-bezier(.22,.9,.3,1) both;transform-origin:top}
.scrim{animation:fade-in .22s ease-out both}
.scrim .sheet{animation:sheet-up .38s cubic-bezier(.22,1,.36,1) both}
.scrim.closing{animation:fade-out .2s ease-in both}
.scrim.closing .sheet{animation:sheet-down .2s ease-in both}
.card, .tile, .stat{transition:transform .2s ease, box-shadow .2s ease}
#toast{animation:pop .3s cubic-bezier(.3,.7,.4,1.4) both}
.pbar span, .t-bar i{transition:width .6s cubic-bezier(.22,.9,.3,1)}
.tb{transition:height .5s cubic-bezier(.22,.9,.3,1)}
