<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>مصاريف 62 — مختبر النواة</title><link rel="stylesheet" href="./app.css"></head><body><main><header><div><h1>مصاريف 62</h1><small>نواة تجريبية · بيانات صناعية فقط</small></div><div class="controls"><label>الثيم<select id="theme"></select></label><label>المظهر<select id="mode"><option value="light">فاتح</option><option value="dark">داكن</option></select></label></div></header><p class="notice">مختبر مستقل، لا يقرأ بيانات حسابك أو يكتب عليها، ولا يتصل بالسحابة.</p><section class="panel" aria-labelledby="summary"><h2 id="summary">الملخص المالي · ديسمبر 2026</h2><div class="cards" id="metrics"></div></section><section class="panel"><h2>أين ذهبت الأموال؟</h2><div id="dna"></div></section><section class="panel"><h2>مختبر القرار المالي</h2><div class="controls"><label>تكلفة قرار جديد (ريال)<input id="cost" inputmode="decimal" value="500"></label><button id="simulate" type="button">محاكاة</button></div><p id="scenario" aria-live="polite"></p><p id="err" role="alert"></p></section><section class="panel"><h2>السجل المالي</h2><label>الحالة<select id="filter"><option value="all">الكل</option><option value="confirmed">مؤكد</option><option value="assumed">تقديري</option><option value="planned">مخطط</option></select></label><div id="ledger"></div></section><section class="panel"><h2>الأمان والمزامنة</h2><p>وضع القراءة التجريبي فقط. لا اتصال بالخادم ولا ترحيل إنتاجي.</p></section></main><script type="module" src="./app.mjs"></script></body></html>
