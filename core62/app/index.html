<!doctype html>
<html lang="ar" dir="rtl" data-theme="reef6181" data-mode="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>مصاريف 62 — المختبر الموحد</title><link rel="stylesheet" href="../demo/themes.css"><link rel="stylesheet" href="./app.css"></head>
<body><main><header class="panel"><div><h1>مصاريف <small>62 Alpha</small></h1><p class="muted">المختبر الموحد · نواة مستقلة</p></div><div class="preferences"><label>الثيم<select id="theme"></select></label><label>المظهر<select id="mode"><option value="light">فاتح</option><option value="dark">داكن</option></select></label></div></header>
<aside class="notice">بيانات اختبار صناعية فقط. لا حفظ دائم أو اتصال سحابي؛ إعادة تحميل الصفحة تمسح الجلسة. لا تستخدم بياناتك الحقيقية.</aside>
<nav id="nav" aria-label="أقسام التطبيق"></nav>
<section class="panel period"><h2>الفترة والمحاكاة</h2><div class="fields"><label>الشهر<input id="month" type="month" value="2026-12"></label><label>تاريخ التحليل<input id="asOf" type="date" value="2026-12-15"></label><label>نهاية التوقع<input id="through" type="date" value="2026-12-31"></label><label>رصيد افتتاحي للمحاكاة (ريال)<input id="opening" inputmode="decimal" value="0"></label></div><button id="refresh" type="button">تحديث العرض</button></section>
<section class="panel" id="view" aria-live="polite"></section>
<section class="panel" id="editor"><h2>إجراء جديد</h2><label>العملية<select id="action"></select></label><form id="form" autocomplete="off"><div class="fields" id="fields"></div><button type="submit">تنفيذ تجريبي</button></form><p id="message" role="status" aria-live="polite"></p></section>
<footer>نسخة هندسية — ليست بديلًا للنسخة الرئيسية</footer></main><script type="module" src="./app.mjs"></script></body></html>
